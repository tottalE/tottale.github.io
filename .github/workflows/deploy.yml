name: Build and deploy wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 전체 git 기록 → Recent changes 날짜용

      - name: Install Typst
        # HTML export 는 아직 실험 기능이라 버전마다 바뀔 수 있어서, 맥에서 쓰는 버전(0.15.1)으로 고정해요.
        env:
          TYPST_URL: https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
        run: |
          curl -sSL "$TYPST_URL" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build
        run: |
          typst --version
          bash build.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
